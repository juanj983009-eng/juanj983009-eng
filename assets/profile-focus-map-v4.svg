<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Professional focus map</title><desc id="desc">A qualitative map of Data Analytics and Business Intelligence, connected to SQL, Power BI, Python, Data Engineering, software and industrial operations. It does not represent skill scores.</desc>
<defs>
 <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#181a1c"/><stop offset="1" stop-color="#0c0e11"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#824324" stop-opacity=".48"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient>
 <linearGradient id="line"><stop stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffba78"/></linearGradient>
</defs>
<rect x="1" y="1" width="958" height="448" rx="12" fill="url(#surface)" stroke="#50382d" stroke-width="2"/>
<path d="M1 44H959" stroke="#3a2f29"/><circle cx="24" cy="22" r="5" fill="#ff5a1f"/><circle cx="41" cy="22" r="5" fill="#ffab76"/><circle cx="58" cy="22" r="5" fill="#72655c"/>
<text x="80" y="27" fill="#dccdbd" font-family="Consolas,monospace" font-size="13">signals / focus.map</text><text x="934" y="27" text-anchor="end" fill="#b4a496" font-family="Consolas,monospace" font-size="11">QUALITATIVE VIEW</text>
<rect x="18" y="60" width="543" height="334" rx="8" fill="#101316" stroke="#3d302a"/>
<text x="36" y="84" fill="#ff9d6c" font-family="Consolas,monospace" font-size="11">01 / CONNECTED DISCIPLINES</text>
<path d="M35 94H544" stroke="#302a26"/>
<circle cx="289" cy="240" r="122" fill="url(#core)"/>
<g fill="none" stroke="#42342e" stroke-width="1"><circle cx="289" cy="240" r="113"/><circle cx="289" cy="240" r="81"/><circle cx="289" cy="240" r="48"/></g>
<g fill="none" stroke="#594034" stroke-width="1"><path d="M289 127V353 M191 184L387 296 M191 296L387 184"/></g>
<circle cx="289" cy="240" r="113" fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="56 654" transform="rotate(-90 289 240)"><animateTransform attributeName="transform" type="rotate" from="-90 289 240" to="270 289 240" dur="16s" repeatCount="indefinite"/></circle>
<circle cx="289" cy="240" r="48" fill="#1b1919" stroke="#ff8a3d" stroke-width="2"/>
<text x="289" y="235" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">DATA</text><text x="289" y="254" text-anchor="middle" fill="#f2e8d5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">ANALYTICS / BI</text>
<g fill="#ff8a3d"><circle cx="289" cy="127" r="5"/><circle cx="387" cy="184" r="5"/><circle cx="387" cy="296" r="5"/><circle cx="289" cy="353" r="5"/><circle cx="191" cy="296" r="5"/><circle cx="191" cy="184" r="5"/></g>
<circle cx="387" cy="184" r="8" fill="none" stroke="#ff995f" opacity=".7"><animate attributeName="r" values="6;15;6" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="3.8s" repeatCount="indefinite"/></circle>
<g font-family="Consolas,monospace" font-size="13" fill="#f2e8d5"><text x="289" y="115" text-anchor="middle">SQL</text><text x="401" y="188">POWER BI</text><text x="401" y="300">PYTHON</text><text x="289" y="376" text-anchor="middle">DATA ENGINEERING</text><text x="178" y="300" text-anchor="end">SOFTWARE</text><text x="178" y="188" text-anchor="end">OPERATIONS</text></g>
<rect x="577" y="60" width="365" height="334" rx="8" fill="#12151a" stroke="#3d302a"/>
<text x="596" y="84" fill="#ff9d6c" font-family="Consolas,monospace" font-size="11">02 / FOCUS AREAS</text><path d="M595 94H924" stroke="#302a26"/>
<g font-family="Consolas,monospace"><text x="598" y="124" font-size="11" fill="#ff9c68">PRIMARY / 01</text><text x="598" y="151" font-size="18" font-weight="bold" fill="#fff">DATA ANALYTICS</text><text x="598" y="174" font-size="14" fill="#f2e8d5">BUSINESS INTELLIGENCE</text>
<text x="598" y="218" font-size="11" fill="#ff9c68">SECONDARY / 02</text><text x="598" y="246" font-size="17" font-weight="bold" fill="#fff">SOFTWARE ENGINEERING</text>
<text x="598" y="292" font-size="11" fill="#ff9c68">LONG-TERM / 03</text><text x="598" y="320" font-size="17" font-weight="bold" fill="#fff">DATA ENGINEERING</text>
