<path d="M596 190H922M596 264H922M596 338H922" stroke="#332b27"/>
<path d="M20 411H940" stroke="#332b27"/><text x="28" y="435" font-family="Consolas,monospace" font-size="12" fill="#d8c9b9"><tspan fill="#ff9c68">context</tspan> → data → insight → decisions</text><text x="930" y="435" text-anchor="end" font-family="Consolas,monospace" font-size="10" fill="#a9998a">NO SCORES / NO RANKING</text>
</svg>
