<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">From operations to decisions</title>
  <desc id="desc">An animated data pipeline: understand operations, structure data, analyze the question and communicate insights.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b432a"/><stop offset="1" stop-color="#302923"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c1b1b"/><stop offset="1" stop-color="#111418"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffad70"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="12" fill="#0e1013" stroke="url(#frame)" stroke-width="2"/>
  <path d="M1 44H959" stroke="#382d28"/>
  <circle cx="24" cy="22" r="5" fill="#ff5a1f"/><circle cx="41" cy="22" r="5" fill="#ffad70"/><circle cx="58" cy="22" r="5" fill="#665d56"/>
  <text x="80" y="27" fill="#e6d9c8" font-family="Consolas,Monaco,monospace" font-size="13">operations_to_insight.pipeline</text>
  <text x="936" y="27" text-anchor="end" fill="#b4a597" font-family="Consolas,Monaco,monospace" font-size="12">DATA WORKFLOW</text>
  <path d="M28 216H932" stroke="#332a25" stroke-dasharray="3 8"/>
  <g stroke="#69442f" stroke-width="2" fill="none">
    <path d="M237 142H257"/><path d="M471 142H491"/><path d="M705 142H725"/>
  </g>
  <g fill="url(#signal)">
    <circle r="4" cx="247" cy="142"><animate attributeName="cx" values="237;257;237" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="481" cy="142"><animate attributeName="cx" values="471;491;471" dur="2.8s" begin=".35s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="715" cy="142"><animate attributeName="cx" values="705;725;705" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="url(#panel)" stroke="#4d382d">
    <rect x="28" y="67" width="209" height="146" rx="8"/>
    <rect x="262" y="67" width="209" height="146" rx="8"/>
    <rect x="496" y="67" width="209" height="146" rx="8"/>
    <rect x="730" y="67" width="202" height="146" rx="8"/>
  </g>
  <g fill="#ff8a3d" font-family="Consolas,Monaco,monospace" font-size="12">
    <text x="45" y="91">01 / CONTEXT</text><text x="279" y="91">02 / STRUCTURE</text><text x="513" y="91">03 / EXPLORE</text><text x="747" y="91">04 / COMMUNICATE</text>
  </g>
  <g stroke="#ff8a3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M48 126v-12l8 5v-5l9 6v11H48z M53 125h2m4 0h2"/>
    <ellipse cx="290" cy="116" rx="10" ry="4"/><path d="M280 116v12c0 5 20 5 20 0v-12 M280 122c0 5 20 5 20 0"/>
    <path d="M515 131v-17m0 17h19 M520 126l5-5 4 2 5-8"/>
    <path d="M750 115h20v15h-20z M755 135h10 M760 130v5 M754 125l4-4 3 2 5-5"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#fff">
    <text x="78" y="129">Operations</text><text x="310" y="129">Data</text><text x="543" y="129">Analysis</text><text x="779" y="129">Decisions</text>
  </g>
  <g font-family="Consolas,Monaco,monospace" font-size="13" fill="#d6c8b8">
    <text x="45" y="162">Understand the</text><text x="45" y="181">process</text>
    <text x="279" y="162">Structure the</text><text x="279" y="181">information</text>
    <text x="513" y="162">Investigate the</text><text x="513" y="181">question</text>
    <text x="747" y="162">Share useful</text><text x="747" y="181">insight</text>
  </g>
  <path d="M28 244H932" stroke="#302a25"/>
  <text x="29" y="272" fill="#ff9b68" font-family="Consolas,Monaco,monospace" font-size="12">TRACE</text>
  <text x="89" y="272" fill="#d4c5b5" font-family="Consolas,Monaco,monospace" font-size="13">process <tspan fill="#ff8a3d">→</tspan> data <tspan fill="#ff8a3d">→</tspan> insight <tspan fill="#ff8a3d">→</tspan> action</text>
  <text x="931" y="272" text-anchor="end" fill="#a99a8c" font-family="Consolas,Monaco,monospace" font-size="11">FROM CONTEXT TO CLARITY</text>
</svg>
