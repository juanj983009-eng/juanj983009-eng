  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#fff">
    <text x="94" y="91">Problem first</text><text x="94" y="152">Data integrity</text><text x="94" y="213">Testing</text><text x="94" y="274">Security by Design</text><text x="94" y="335">Maintainability</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#dfd1c1">
    <text x="94" y="110">Understand the operation and business question.</text>
    <text x="94" y="171">Model, trace and validate information.</text>
    <text x="94" y="232">Check behavior and protect against regressions.</text>
    <text x="94" y="293">Consider secrets, access and input validation.</text>
    <text x="94" y="354">Keep systems clear and document decisions.</text>
  </g>
