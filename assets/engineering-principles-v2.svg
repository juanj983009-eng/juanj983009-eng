    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191a1b"/><stop offset="1" stop-color="#0d1013"/></linearGradient>
    <linearGradient id="flow" x2="0" y2="1"><stop stop-color="#ffad70"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient>
